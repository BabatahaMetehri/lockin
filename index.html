<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LOCK IN</title>
  <meta name="theme-color" content="#0a0b0d" />
  <meta name="description" content="Your private weight-loss coach. Just do what's on the screen." />
  <!-- Security: CSP locks the page down. Only self assets + Google Fonts + Open Food Facts API. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://world.openfoodfacts.org; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="no-referrer" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LOCK IN" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- LOCK SCREEN (PIN gate) -->
  <div id="lock-screen" class="lock-screen" hidden>
    <div class="lock-card">
      <div class="brand"><span class="brand-mark">◆</span> LOCK<span class="brand-accent">IN</span></div>
      <p id="lock-title" class="lock-title">Enter your PIN</p>
      <p id="lock-sub" class="lock-sub muted"></p>
      <div id="pin-dots" class="pin-dots"></div>
      <div class="keypad" id="keypad"></div>
      <p id="lock-error" class="lock-error" role="alert"></p>
    </div>
  </div>

  <!-- APP -->
  <div id="app" hidden>
    <aside class="sidenav" id="sidenav"></aside>
    <main id="screen" class="screen"></main>
    <nav class="bottomnav" id="bottomnav"></nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
